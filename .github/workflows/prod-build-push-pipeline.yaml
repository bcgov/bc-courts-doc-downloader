name: Tag Images to Prod and Push to Artifactory

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/prod-build-push-pipeline.yaml"
  workflow_dispatch:
env:
  WORKING_DIRECTORY: ./
  TEST_IMAGE_TAG: test
  PROD_IMAGE_TAG: prod
  API_IMAGE_NAME: docdownloader-api
  REDIS_IMAGE_NAME: docdownloader-redis-cache-client
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      # Get SHORT_SHA to tag images
      - name: Get short SHA
        id: short_sha
        run: |
          echo "::set-output name=SHORT_SHA::$(git rev-parse --short HEAD)"
          echo "Short SHA: $SHORT_SHA"   

      - name: Login to Artifactory
        uses: docker/login-action@v1
        with:
          registry: artifacts.developer.gov.bc.ca
          username: ${{ secrets.DOCDOWNLOADER_ARTIFACTORY_USERNAME }}
          password: ${{ secrets.DOCDOWNLOADER_ARTIFACTORY_PASSWORD }}  
      
      - name: Docker Pull from Artifactory
        id: pull
        run: |
          docker pull artifacts.developer.gov.bc.ca/sdc2-docdownloader-api/${{ env.API_IMAGE_NAME }}:${{ env.TEST_IMAGE_TAG }}
          docker pull artifacts.developer.gov.bc.ca/sdc2-docdownloader-redis-cache-client/${{ env.REDIS_IMAGE_NAME }}:${{ env.TEST_IMAGE_TAG }}
      
      - name: Tag to Prod
        id: retag
        run: |
          docker tag artifacts.developer.gov.bc.ca/sdc2-docdownloader-api/${{ env.API_IMAGE_NAME }}:${{ env.TEST_IMAGE_TAG }} artifacts.developer.gov.bc.ca/sdc2-docdownloader-api/${{ env.API_IMAGE_NAME }}:${{ env.PROD_IMAGE_TAG }}
          docker tag artifacts.developer.gov.bc.ca/sdc2-docdownloader-redis-cache-client/${{ env.REDIS_IMAGE_NAME }}:${{ env.TEST_IMAGE_TAG }} artifacts.developer.gov.bc.ca/sdc2-docdownloader-redis-cache-client/${{ env.REDIS_IMAGE_NAME }}:${{ env.PROD_IMAGE_TAG }}

      - name: Docker Push to Artifactory
        id: publish
        run: |
          docker push artifacts.developer.gov.bc.ca/sdc2-docdownloader-api/${{ env.API_IMAGE_NAME }}:${{ env.PROD_IMAGE_TAG }}
          docker push artifacts.developer.gov.bc.ca/sdc2-docdownloader-redis-cache-client/${{ env.REDIS_IMAGE_NAME }}:${{ env.PROD_IMAGE_TAG }}
      
      - name: Checkout ArgoCD Repo
        id: gitops
        if: steps.publish.outcome == 'success'
        uses: actions/checkout@v4
        with:
          repository: bcgov-c/tenant-gitops-dc2d23
          ref: main
          token: ${{ secrets.GIT_OPS_PAT }} # `GIT_OPS_PAT` is a secret that contains your PAT
          path: gitops

      - name: Update Helm Values and Commit
        id: helm
        if: steps.gitops.outcome == 'success'  # Only run if the previous step (publish) was successful
        run: |
          # Clone the GitOps deployment configuration repository
          # Navigate to the directory containing your Helm values file for the environment develop -> DEV, test -> test and 
          cd gitops/charts
          
          # Update the Helm values file with the new image tag or (SHA)
          DATETIME=$(date +'%Y-%m-%d %H:%M:%S')  # Get current date and time
          sed -i "s/apitag: .*/apitag: ${{ env.PROD_IMAGE_TAG }} # Image Updated on $DATETIME/" ../deploy/prod_values.yaml
          sed -i "s/rediscachetag: .*/rediscachetag: ${{ env.PROD_IMAGE_TAG }} # Image Updated on $DATETIME/" ../deploy/prod_values.yaml

          sed -i "s/apiversion: .*/apiversion: ${{ steps.short_sha.outputs.SHORT_SHA }} # Version Updated on $DATETIME/" ../deploy/prod_values.yaml
          sed -i "s/rediscacheversion: .*/rediscacheversion: ${{ steps.short_sha.outputs.SHORT_SHA }} # Version Updated on $DATETIME/" ../deploy/prod_values.yaml
          
          # Commit and push the changes
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          
          git add ../deploy/prod_values.yaml
          
          # Repackage Helm Chart  

          cd docdownloader-gitops

          helm dependency build
          
          cd charts
          
          git add .
          
          git commit -m "Update prod image tags on $DATETIME"
          git push origin main  # Update the branch name as needed
